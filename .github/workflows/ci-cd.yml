name: VeriPie CI/CD

on:
  push:
    branches:
      - main
      - V1.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Quality Gate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Enforce zero-emoji policy
        run: python scripts/check_no_emoji.py

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint backend with Ruff
        run: ruff check backend scripts

      - name: Run backend unit tests
        working-directory: backend
        run: pytest -m "not docker and not jplag"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Azure VM
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Deploy via SSH to Azure VM
        env:
          VPS_HOST_CHECK: ${{ secrets.VPS_HOST }}
        if: env.VPS_HOST_CHECK != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            cd ~/ai-assisted-code-grading
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd frontend
            npm ci
            npm run build
            cd ..

            docker compose up -d --build
            docker update --restart unless-stopped $(docker compose ps -q postgres redis backend worker)

            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8000/health; then
                exit 0
              fi
              sleep 5
            done
            echo "Backend health check failed after 60s" >&2
            exit 1
