services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grading_db
      POSTGRES_USER: grading_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grading_user -d grading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://grading_user:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/grading_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      SUBMISSION_STORAGE_PATH: /data/submissions
      JPLAG_JAR_PATH: /tools/jplag-6.2.0.jar
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ./backend:/app
      - ./tools:/tools:ro
      - submission_data:/data/submissions
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  sandbox-image:
    build:
      context: ./sandbox
    image: grading-sandbox:latest
    command: ["true"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://grading_user:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/grading_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      SUBMISSION_STORAGE_PATH: /data/submissions
      GRADING_SANDBOX_IMAGE: grading-sandbox:latest
    depends_on:
      backend:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - submission_data:/data/submissions:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "app.worker"]

volumes:
  postgres_data:
  submission_data:
