services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grading_db
      POSTGRES_USER: grading_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grading_user -d grading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://grading_user:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/grading_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      SUBMISSION_STORAGE_PATH: /data/submissions
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - submission_data:/data/submissions
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

volumes:
  postgres_data:
  submission_data:
